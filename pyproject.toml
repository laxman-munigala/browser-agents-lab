[project]
name = "browser-agents-lab"
version = "0.1.0"
description = "One web task solved at every level of the stack, from a search API to an autonomous browser agent"
readme = "README.md"
authors = [
    { name = "Laxman Munigala", email = "laxman.munigala@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "playwright>=1.60",
    "python-dotenv>=1.1",
    "websockets>=15",
    "pydantic>=2.11",
    "tinyfish>=0.8",
    "browser-use>=0.13",
    "stagehand>=4.1",
]

[tool.uv]
package = false
